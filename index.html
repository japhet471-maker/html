<!DOCTYPE html>
<!-- html tag -->
<html lang="en">
<!-- head tag -->
<head>
    <!-- meta tag (self closing tag) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- open graph tags -->

    <title>hello</title>

    <!-- title tag -->
</head>
<!-- body tag -->
<body>
    <h1>hello 1</h1>
    <h2>hello 2</h2>
    <h3>hello 3s</h3>
    <h4>hello 4</h4>
    <h5>hello 5</h5>
    <h6>hello 6</h6>

    <!-- paragraph tag -->
     <p>paragraph</p>
     <!-- div tag(container tag) -->
      <div>div container</div>

      <!-- anchor tag -->
       <a href="https://google.com">google link</a>
</body>
<!-- header tags -->
</html>
