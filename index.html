<!doctype html>
<!-- html tag -->
<html lang="en">
  <!-- head tag -->
  <head>
    <!-- meta tag (self closing tag) -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- open graph tags -->

    <title>hello</title>
    <!-- open graph tags -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta propert="og site_name" content="name of site" />
    <meta property="og title=japhet" />
    <meta property="og:title" content="random description" />
    <meta property="og:url" content="https://mysite.com" />
    <meta property="og:image" content="https//mysite.com/banner.jpg" />
  </head>
  <body>
    <h1>hello 1</h1>
    <h2>hello 2</h2>
    <h3>hello 3</h3>
    <h4>hello 4</h4>
    <h5>hello 5</h5>
    <h6>hello 6</h6>

    <!-- paragraph tag -->
    <p>paragraph</p>

    <!-- div tag(container tag) -->
    <div>div container</div>

    <!-- anchor tag -->
    <a href="https://google.com">google link</a>

    <!-- list tag -->

    <!-- unordered list tags -->
    <ul>
      <li>James</li>
      <li>John</li>
    </ul>

    <!-- ordered list tags -->
    <ol>
      <li>John</li>
      <li>James</li>
    </ol>

    <!-- header t -->
    <header>header tag</header>

    <!-- footer tag -->
    <footer>footer tag</footer>

    <!-- image tag -->
    <img src="/download.jpg" alt="elephant image" />

    <!-- break tag-  -->
    <br />

    <!-- bold tag -->
    <b>bold</b>

    <br />
    <!-- strong tag -->
    <strong>strong</strong>
    <br />

    <!-- italic tag -->
    <i>italic</i>
    <br />
    <!-- emphasis -->
    <em>emphasis</em>
    <br />
    <!-- delete tag -->
    <del>delete</del>
    <br />
    <!-- line tag(horizontal) -->
    <hr />
    <br />
    <!-- highlight/mark tag -->
    <mark>mark</mark>
    <br />
    <!-- form tag -->
    <form action="">
      <!-- label tag -->
      <label>Username</label>
      <!-- input tag -->
      <input type="text" placeholder="johndoe" />

      <br />
      <label>Email</label>
      <input type="email" placeholder="example@gmail.com" />

      <br />
      <label for="">Password</label>
      <input type="password" placeholder="Enter Password" />
    </form>

    <!-- table tag -->
    <table>
      <tr>
        <th>Company</th>
        <th>Contact</th>
      </tr>

      <tr>
        <td>Microsoft</td>
        <td>USA</td>
      </tr>
      <tr>
        <td>Schoolville</td>
        <td>Nigeria</td>
      </tr>
    </table>
  </body>
</html>
